<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<title>Grübeluhr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel2: #262a32;
    --line: #333844;
    --text: #f1ede4;
    --muted: #9a9ea8;
    --accent: #f2b544;
    --danger: #e5604f;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  input { font: inherit; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Setup ---------- */
  .setup { max-width: 560px; margin: 0 auto; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
  .brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
  .brand img { width: 44px; height: 44px; border-radius: 12px; }
  .brand h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 22px 4px 10px; }
  .plist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pcard { min-width: 0; background: var(--panel); border-radius: var(--radius); padding: 10px; border-left: 8px solid var(--c); }
  .prow { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 44px; height: 44px; border-radius: 50%; background: var(--c); flex: none;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
  .pname { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); padding: 0 12px; font-size: 17px; }
  .pname:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .ibtn { width: 36px; height: 44px; border-radius: 10px; color: var(--muted); font-size: 18px; flex: none; }
  .ibtn:active { background: var(--panel2); }
  .ibtn:disabled { opacity: .25; }
  .palette { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; padding: 12px 2px 4px; }
  .sw { aspect-ratio: 1; border-radius: 50%; background: var(--sc); position: relative;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
  .sw.used::after { content: ""; position: absolute; inset: 35%; border-radius: 50%; background: rgba(0,0,0,.45); }
  .sw.sel { outline: 3px solid var(--text); outline-offset: 2px; }
  .sw.custom { background: conic-gradient(#e53935, #fdd835, #43a047, #00acc1, #1e88e5, #8e24aa, #e53935);
    display: grid; place-items: center; overflow: hidden; }
  .sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .btn { flex: 1; height: 48px; border-radius: 14px; background: var(--panel); font-weight: 600; }
  .btn:active { background: var(--panel2); }
  .toggles { background: var(--panel); border-radius: var(--radius); padding: 4px 14px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; height: 52px; font-size: 16px; }
  .toggle + .toggle { border-top: 1px solid var(--line); }
  .switch { appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line);
    position: relative; transition: background .2s; cursor: pointer; flex: none; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(20px); }
  .start { width: 100%; height: 64px; margin-top: 24px; border-radius: 18px; background: var(--accent);
    color: #1b1406; font-size: 20px; font-weight: 800; }
  .start:active { transform: scale(.99); }
  .start:disabled { opacity: .4; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px; }

  /* ---------- Game ---------- */
  .game { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 10px calc(10px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .topbar { display: flex; align-items: center; gap: 8px; height: 56px; flex: none; }
  .tb { height: 42px; min-width: 42px; padding: 0 14px; border-radius: 12px; background: var(--panel); font-weight: 700; font-size: 15px; }
  .tb:active { background: var(--panel2); }
  .tb.small { min-width: 34px; height: 34px; padding: 0; font-size: 18px; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 10px; }
  .tb.small:disabled { opacity: .25; }
  .info { flex: 1; text-align: center; line-height: 1.15; }
  .info .r { font-weight: 800; font-size: 17px; }
  .info .g { color: var(--muted); font-size: 13px; }
  .big { flex: 1; min-height: 0; width: 100%; border-radius: 28px; background: var(--c); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 12px 40px -10px var(--c); transition: background .25s, box-shadow .25s; }
  .big:active { filter: brightness(.94); }
  .half { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; min-height: 0; }
  .half.flip { transform: rotate(180deg); }
  .nm { font-size: clamp(26px, 9vw, 64px); font-weight: 800; letter-spacing: -0.5px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm { font-size: clamp(56px, 21vw, 170px); font-weight: 800; line-height: .95; letter-spacing: -2px; }
  .tot { font-size: clamp(13px, 3.6vw, 18px); opacity: .75; font-weight: 600; }
  .divider { flex: none; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; opacity: .55;
    border-top: 2px dashed currentColor; border-bottom: 2px dashed currentColor; padding: 5px 0; margin: 0 18%; }
  .big.flash { animation: flash .35s ease-out; }
  @keyframes flash { from { transform: scale(.97); } to { transform: scale(1); } }
  .strip { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 12px;
    padding: 8px 12px; font-size: 14px; border: 2px solid transparent; }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  .chip .t { color: var(--muted); }
  .chip.now { border-color: var(--c); }
  .chip.next .n::after { content: " · als Nächstes"; color: var(--muted); font-size: 12px; }
  .pauseov { position: fixed; inset: 0; background: rgba(14,15,18,.92); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28vh; z-index: 5; text-align: center; }
  .pauseov .pm { font-size: clamp(40px, 12vw, 90px); font-weight: 800; }
  .pauseov .pm small { display: block; font-size: 16px; font-weight: 500; color: var(--muted); margin-top: 6px; }
  .pauseov .pm.flip { transform: rotate(180deg); }

  /* ---------- Stats ---------- */
  .stats { max-width: 560px; margin: 0 auto; padding: 28px 16px calc(32px + env(safe-area-inset-bottom)); }
  .stats h1 { margin: 0 0 4px; font-size: 30px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 8px; }
  .kpi { background: var(--panel); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font-size: 22px; }
  .kpi span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .rank { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .rk { background: var(--panel); border-radius: var(--radius); padding: 14px; }
  .rhead { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .rhead .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--c); flex: none; }
  .rhead .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 10px; border-radius: 5px; background: var(--panel2); margin: 10px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 5px; }
  .sub { color: var(--muted); font-size: 14px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--panel2); }
  .btns { display: grid; gap: 10px; margin-top: 22px; }
  .btn.primary { background: var(--accent); color: #1b1406; height: 58px; font-size: 18px; font-weight: 800; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }

  /* ---------- Modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 10; }
  .mbox { background: var(--panel); border-radius: 22px; padding: 22px; width: 100%; max-width: 380px; }
  .mbox h2 { margin: 0 0 8px; font-size: 22px; }
  .mbox p { margin: 0 0 20px; color: var(--muted); line-height: 1.4; }
  .mbtns { display: flex; gap: 10px; }
  .mbtns .btn { background: var(--panel2); }
  .mbtns .ok { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div id="app"></div>

<div id="modal" class="modal hidden">
  <div class="mbox">
    <h2 id="mtitle">Bist du sicher?</h2>
    <p id="mtext"></p>
    <div class="mbtns">
      <button class="btn" id="mcancel">Abbrechen</button>
      <button class="btn ok" id="mok">Ja</button>
    </div>
  </div>
</div>

<script>
'use strict';

const PALETTE = [
  ['Rot', '#e53935'], ['Orange', '#fb8c00'], ['Gelb', '#fdd835'], ['Grün', '#43a047'],
  ['Türkis', '#00acc1'], ['Blau', '#1e88e5'], ['Lila', '#8e24aa'], ['Pink', '#ec407a'],
  ['Braun', '#8d6e63'], ['Grau', '#90a4ae'], ['Schwarz', '#2b2b2b'], ['Weiß', '#f2f2f2'],
];
const KEY = 'gruebeluhr.v1';
const TAP_LOCK_MS = 700;

let S = load() || defaultState();
let openColor = -1;       // which player's palette is open in setup
let lastTap = 0;
let tickTimer = null;

/* ---------- Persistence ---------- */
function defaultState() {
  return {
    phase: 'setup',
    players: [0, 5, 3, 2].map((c, i) => ({ id: uid(), name: 'Spieler ' + (i + 1), color: PALETTE[c][1] })),
    settings: { sound: true, vibrate: true },
    game: null,
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.players ? s : null; } catch (e) { return null; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function uid() { return Math.random().toString(36).slice(2, 9); }

/* ---------- Helpers ---------- */
const $ = (sel) => document.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmt(ms) {
  const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
}
function ink(hex) {
  const h = hex.replace('#', '');
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.4 ? '#141414' : '#ffffff';
}

/* ---------- Feedback (Ton / Vibration) ---------- */
let audioCtx = null;
function beep(newRound) {
  if (!S.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    (newRound ? [523, 784] : [660]).forEach((f, k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + k * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.18);
    });
  } catch (e) {}
}
function feedback(newRound) {
  beep(newRound);
  if (S.settings.vibrate && navigator.vibrate) navigator.vibrate(newRound ? [40, 70, 40] : 40);
}

/* ---------- Bildschirm wach halten ---------- */
let wakeLock = null;
async function setWake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.phase === 'game') setWake(true);
});

/* ---------- Game logic ---------- */
function cur() { const t = S.game.turns; return t[t.length - 1]; }
function turnMs(t) { return t.ms + (t.at ? Date.now() - t.at : 0); }
function playerTotal(i) { return S.game.turns.reduce((a, t) => a + (t.p === i ? turnMs(t) : 0), 0); }
function gameTotal() { return S.game.turns.reduce((a, t) => a + turnMs(t), 0); }

function startGame() {
  const now = Date.now();
  const players = S.players.map((p, i) => ({ ...p, name: p.name.trim() || 'Spieler ' + (i + 1) }));
  S.game = { players, turns: [{ p: 0, ms: 0, at: now, round: 1 }], paused: false };
  S.phase = 'game';
  lastTap = now;
  save(); render();
  feedback(false);
}
function nextTurn() {
  const g = S.game, now = Date.now();
  if (g.paused || now - lastTap < TAP_LOCK_MS) return;
  lastTap = now;
  const c = cur();
  c.ms += now - c.at; c.at = null;
  const np = (c.p + 1) % g.players.length;
  g.turns.push({ p: np, ms: 0, at: now, round: c.round + (np === 0 ? 1 : 0) });
  save(); updateGame(true);
  feedback(np === 0);
}
function undo() {
  const g = S.game;
  if (g.turns.length < 2) return;
  const now = Date.now();
  const removed = g.turns.pop();
  const p = cur();
  // Die Zeit seit dem (versehentlichen) Weitertippen gehört dem vorherigen Spieler.
  p.ms += turnMs(removed);
  p.at = g.paused ? null : now;
  lastTap = now;
  save(); updateGame(true);
}
function togglePause() {
  const g = S.game, c = cur(), now = Date.now();
  if (!g.paused) { c.ms += now - c.at; c.at = null; g.paused = true; }
  else { c.at = now; g.paused = false; lastTap = now; }
  save(); updateGame(false);
}
function endGame() {
  const c = cur();
  if (c.at) { c.ms += Date.now() - c.at; c.at = null; }
  S.game.paused = true;
  S.phase = 'end';
  save(); render();
}
function continueGame() {
  S.phase = 'game';
  save(); render();
}

/* ---------- Modal ---------- */
function ask(title, text, okLabel, onOk) {
  $('#mtitle').textContent = title;
  $('#mtext').textContent = text;
  $('#mok').textContent = okLabel;
  $('#modal').classList.remove('hidden');
  const close = () => { $('#modal').classList.add('hidden'); $('#mok').onclick = null; };
  $('#mcancel').onclick = close;
  $('#modal').onclick = (e) => { if (e.target.id === 'modal') close(); };
  $('#mok').onclick = () => { close(); onOk(); };
}

/* ---------- Render ---------- */
function render() {
  clearInterval(tickTimer);
  document.body.style.overflow = S.phase === 'game' ? 'hidden' : '';
  if (S.phase === 'game') { renderGame(); setWake(true); tickTimer = setInterval(() => updateGame(false), 250); }
  else { setWake(false); S.phase === 'end' ? renderStats() : renderSetup(); }
  window.scrollTo(0, 0);
}

function renderSetup() {
  const used = S.players.map((p) => p.color.toLowerCase());
  const n = S.players.length;
  $('#app').innerHTML = `
  <main class="setup">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div><h1>Grübeluhr</h1><p>Wer überlegt am längsten?</p></div>
    </div>
    <div class="label">Spieler · Reihenfolge = Zugreihenfolge</div>
    <ol class="plist">
      ${S.players.map((p, i) => `
      <li class="pcard" style="--c:${p.color}">
        <div class="prow">
          <button class="swatch" data-act="color" data-i="${i}" aria-label="Farbe wählen"></button>
          <input class="pname" data-i="${i}" value="${esc(p.name)}" maxlength="16" placeholder="Name" autocomplete="off">
          <button class="ibtn" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="nach oben">↑</button>
          <button class="ibtn" data-act="down" data-i="${i}" ${i === n - 1 ? 'disabled' : ''} aria-label="nach unten">↓</button>
          <button class="ibtn" data-act="del" data-i="${i}" ${n <= 2 ? 'disabled' : ''} aria-label="entfernen">✕</button>
        </div>
        ${openColor === i ? `
        <div class="palette">
          ${PALETTE.map(([name, c]) => `<button class="sw ${c === p.color.toLowerCase() ? 'sel' : used.includes(c) ? 'used' : ''}"
            style="--sc:${c}" data-act="pick" data-i="${i}" data-c="${c}" aria-label="${name}"></button>`).join('')}
          <label class="sw custom" aria-label="eigene Farbe"><input type="color" data-i="${i}" value="${p.color}"></label>
        </div>` : ''}
      </li>`).join('')}
    </ol>
    <div class="row">
      <button class="btn" data-act="add" ${n >= 20 ? 'disabled' : ''}>+ Spieler</button>
      <button class="btn" data-act="shuffle">🎲 Mischen</button>
    </div>
    <div class="label">Einstellungen</div>
    <div class="toggles">
      <label class="toggle">Ton beim Zugwechsel <input type="checkbox" class="switch" data-set="sound" ${S.settings.sound ? 'checked' : ''}></label>
      <label class="toggle">Vibration <input type="checkbox" class="switch" data-set="vibrate" ${S.settings.vibrate ? 'checked' : ''}></label>
    </div>
    <button class="start" data-act="start">Partie starten</button>
    <p class="hint">Spieler und Farben bleiben für den nächsten Abend gespeichert.</p>
  </main>`;
}

function renderGame() {
  $('#app').innerHTML = `
  <main class="game">
    <div class="topbar">
      <button class="tb small" data-act="undo" id="undoBtn" aria-label="Zurück zum vorherigen Spieler">↶</button>
      <div class="info"><div class="r num" id="round"></div><div class="g num" id="gtime"></div></div>
      <button class="tb" data-act="pause" aria-label="Pause">❚❚</button>
      <button class="tb" data-act="end">Ende</button>
    </div>
    <button class="big" id="big" data-act="next">
      <div class="half flip"><div class="nm" id="nm1"></div><div class="tm num" id="tm1"></div></div>
      <div class="divider">Tippen = nächster Zug</div>
      <div class="half"><div class="nm" id="nm2"></div><div class="tm num" id="tm2"></div><div class="tot num" id="tot"></div></div>
    </button>
    <div class="strip" id="strip"></div>
    <div class="pauseov hidden" id="pauseov" data-act="pause">
      <div class="pm flip">Pause<small>Tippen zum Fortsetzen</small></div>
      <div class="pm">Pause<small>Tippen zum Fortsetzen</small></div>
    </div>
  </main>`;
  updateGame(true);
}

function updateGame(structural) {
  if (S.phase !== 'game') return;
  const g = S.game, c = cur(), p = g.players[c.p], n = g.players.length;
  const t = fmt(turnMs(c));
  $('#tm1').textContent = t;
  $('#tm2').textContent = t;
  $('#gtime').textContent = 'Spielzeit ' + fmt(gameTotal());
  $('#tot').textContent = 'gesamt ' + fmt(playerTotal(c.p));
  if (structural) {
    const big = $('#big');
    big.style.setProperty('--c', p.color);
    big.style.setProperty('--ink', ink(p.color));
    $('#nm1').textContent = p.name;
    $('#nm2').textContent = p.name;
    $('#round').textContent = 'Runde ' + c.round;
    $('#undoBtn').disabled = g.turns.length < 2;
    big.classList.remove('flash'); void big.offsetWidth; big.classList.add('flash');
    const nextP = (c.p + 1) % n;
    $('#strip').innerHTML = g.players.map((pl, i) =>
      `<div class="chip ${i === c.p ? 'now' : ''} ${i === nextP && n > 1 ? 'next' : ''}" style="--c:${pl.color}">
        <span class="dot"></span><span class="n">${esc(pl.name)}</span><span class="t num" data-pt="${i}"></span></div>`).join('');
    const nowChip = $('#strip .chip.now');
    if (nowChip) nowChip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }
  document.querySelectorAll('[data-pt]').forEach((el) => { el.textContent = fmt(playerTotal(+el.dataset.pt)); });
  $('#pauseov').classList.toggle('hidden', !g.paused);
}

function renderStats() {
  const g = S.game;
  const rows = g.players.map((p, i) => {
    const ts = g.turns.filter((t) => t.p === i).map(turnMs);
    const total = ts.reduce((a, b) => a + b, 0);
    return { ...p, i, total, turns: ts.length, avg: ts.length ? total / ts.length : 0, longest: ts.length ? Math.max(...ts) : 0 };
  }).sort((a, b) => b.total - a.total);
  const max = Math.max(1, ...rows.map((r) => r.total));
  const active = rows.filter((r) => r.turns > 0);
  const slow = active.length > 1 ? rows[0].i : -1;
  const fast = active.length > 1 ? active.reduce((a, b) => (b.avg < a.avg ? b : a)).i : -1;
  const longestTurn = active.length > 1 ? active.reduce((a, b) => (b.longest > a.longest ? b : a)).i : -1;
  const badges = (i) => [i === slow && '👑 Grübelkönig', i === fast && '⚡ Schnellste Züge', i === longestTurn && '🐢 Längster Einzelzug'].filter(Boolean);

  $('#app').innerHTML = `
  <main class="stats">
    <h1>Partie vorbei</h1>
    <div class="kpis">
      <div class="kpi"><b class="num">${fmt(gameTotal())}</b><span>Spielzeit</span></div>
      <div class="kpi"><b class="num">${cur().round}</b><span>Runden</span></div>
      <div class="kpi"><b class="num">${g.turns.length}</b><span>Züge</span></div>
    </div>
    <ol class="rank">
      ${rows.map((r) => `
      <li class="rk" style="--c:${r.color}">
        <div class="rhead"><span class="dot"></span><span class="n">${esc(r.name)}</span><span class="num">${fmt(r.total)}</span></div>
        <div class="bar"><i style="width:${(r.total / max) * 100}%"></i></div>
        <div class="sub num">${r.turns} ${r.turns === 1 ? 'Zug' : 'Züge'} · Ø ${fmt(r.avg)} · längster ${fmt(r.longest)}</div>
        ${badges(r.i).length ? `<div class="badges">${badges(r.i).map((b) => `<span class="badge">${b}</span>`).join('')}</div>` : ''}
      </li>`).join('')}
    </ol>
    <div class="btns">
      <button class="btn primary" data-act="rematch">Revanche · gleiche Spieler</button>
      <button class="btn" data-act="toSetup">Spieler ändern</button>
      <button class="btn ghost" data-act="continue">Doch weiterspielen</button>
    </div>
  </main>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, i = +el.dataset.i;
  const P = S.players;
  switch (act) {
    // Setup
    case 'color': openColor = openColor === i ? -1 : i; renderSetup(); break;
    case 'pick': P[i].color = el.dataset.c; openColor = -1; save(); renderSetup(); break;
    case 'up': [P[i - 1], P[i]] = [P[i], P[i - 1]]; openColor = -1; save(); renderSetup(); break;
    case 'down': [P[i + 1], P[i]] = [P[i], P[i + 1]]; openColor = -1; save(); renderSetup(); break;
    case 'del': P.splice(i, 1); openColor = -1; save(); renderSetup(); break;
    case 'add': {
      const used = P.map((p) => p.color.toLowerCase());
      const free = PALETTE.find(([, c]) => !used.includes(c));
      P.push({ id: uid(), name: 'Spieler ' + (P.length + 1), color: free ? free[1] : PALETTE[P.length % PALETTE.length][1] });
      openColor = -1; save(); renderSetup();
      break;
    }
    case 'shuffle':
      for (let k = P.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [P[k], P[j]] = [P[j], P[k]]; }
      openColor = -1; save(); renderSetup(); break;
    case 'start': startGame(); break;
    // Game
    case 'next': nextTurn(); break;
    case 'pause': togglePause(); break;
    case 'undo': {
      const g = S.game;
      const prev = g.players[g.turns[g.turns.length - 2].p];
      ask('Bist du sicher?', `Der Timer springt zurück zu ${prev.name}. Die Zeit seit dem letzten Tippen wird ${prev.name} angerechnet.`,
        'Ja, zurück', undo);
      break;
    }
    case 'end': ask('Partie beenden?', 'Die Uhr stoppt und die Statistik wird angezeigt. Du kannst danach noch weiterspielen.', 'Beenden', endGame); break;
    // Stats
    case 'rematch': startGame(); break;
    case 'toSetup': S.phase = 'setup'; S.game = null; save(); render(); break;
    case 'continue': continueGame(); break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.classList.contains('pname')) { S.players[+e.target.dataset.i].name = e.target.value; save(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.type === 'color') { S.players[+t.dataset.i].color = t.value.toLowerCase(); openColor = -1; save(); renderSetup(); }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.checked; save(); }
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
